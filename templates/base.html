<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Нотатки{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a class="logo" href="{{ url_for('index') }}">📝 Нотатки</a>
            <nav class="menu">
                <a href="{{ url_for('index') }}">Усі нотатки</a>
                <a class="btn btn-small" href="{{ url_for('add') }}">+ Додати</a>
            </nav>
        </div>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Notes App · Flask + SQLite</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
