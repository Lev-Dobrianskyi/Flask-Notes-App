{% extends "base.html" %}
{% block title %}Додати нотатку{% endblock %}
{% block content %}
<h1 class="page-title">Нова нотатка</h1>

<form class="form-card" method="post">
    <label for="header">Заголовок</label>
    <input type="text" id="header" name="header" value="{{ header }}" required>

    <label for="text">Текст</label>
    <textarea id="text" name="text" rows="8">{{ text }}</textarea>

    <p class="error">{{ error }}</p>

    <button class="btn" type="submit">Зберегти</button>
</form>
{% endblock %}
